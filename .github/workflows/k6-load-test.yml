name: K6 Load Testing

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  load-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt
        pip install matplotlib pandas numpy python-docx reportlab waitress openpyxl xlsxwriter pytest

    - name: Setup K6
      run: |
        curl -s https://gpg.k6.io/key.gpg | gpg --dearmor | sudo tee /usr/share/keyrings/k6-archive-keyring.gpg >/dev/null
        echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
        sudo apt-get update
        sudo apt-get install k6

    - name: Run Orchestrated Load Tests
      run: |
        python load-testing/run_load_tests.py
      env:
        TARGET_URL: http://localhost:5000

    - name: Upload K6 Load Test Excel Report
      uses: actions/upload-artifact@v4
      with:
        name: K6_Load_Test_Report.xlsx
        path: load-testing/reports/K6_Load_Test_Report.xlsx

    - name: Upload summary.html
      uses: actions/upload-artifact@v4
      with:
        name: summary.html
        path: load-testing/reports/summary.html

    - name: Upload summary.json
      uses: actions/upload-artifact@v4
      with:
        name: summary.json
        path: load-testing/reports/summary.json

    - name: Upload metrics.csv
      uses: actions/upload-artifact@v4
      with:
        name: metrics.csv
        path: load-testing/reports/metrics.csv

    - name: Upload console.log
      uses: actions/upload-artifact@v4
      with:
        name: console.log
        path: load-testing/console.log

    - name: Commit and Push Reports to GitHub
      run: |
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git config --global user.name "github-actions[bot]"
        
        # Pull latest changes to avoid push conflicts
        git pull origin master || git pull origin main || true
        
        # Add generated reports
        git add load-testing/reports/
        
        # Commit and push if there are changes
        if git diff-index --quiet HEAD --; then
          echo "No changes to commit."
        else
          git commit -m "feat: add automated K6 load testing Excel report to GitHub Actions"
          git push origin HEAD:${{ github.ref_name }}
        fi
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
