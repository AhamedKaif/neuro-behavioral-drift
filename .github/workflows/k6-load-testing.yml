name: K6 Load Testing

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  load-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt
        pip install matplotlib pandas numpy python-docx reportlab waitress pytest

    - name: Setup K6
      run: |
        curl -s https://gpg.k6.io/key.gpg | gpg --dearmor | sudo tee /usr/share/keyrings/k6-archive-keyring.gpg >/dev/null
        echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
        sudo apt-get update
        sudo apt-get install k6

    - name: Run Orchestrated Load Tests
      run: |
        python load-testing/run_load_tests.py
      env:
        TARGET_URL: http://localhost:5000

    - name: Upload Load Test Reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: k6-load-test-reports
        path: |
          load-testing/reports/
          load-testing/summary.json
          load-testing/summary.html
          load-testing/metrics.csv
          load-testing/passed_requests.csv
          load-testing/failed_requests.csv
          load-testing/error_breakdown.csv
          load-testing/response_time_distribution.csv
          load-testing/throughput.csv
          load-testing/latency.csv
